function answer(o){
  const g=S.game;if(g.lock)return;const q=g.qs[g.qi],el=document.getElementById('opt_'+o);

  return `<div class="view">${backBtn()}<h2 class="sec">${S.themeName}（${S.themeWords.length}词）</h2>
  ${S.themeWords.map(w=>{const i=winfo(w);return `<div class="lrow wordrow" onclick="wordModal('${w}')">
    <img src="${wimg(w)}"><div><div class="tt">${i.w}</div><div class="tc">${i.m}</div></div>
    <div class="st st-todo">👁</div></div>`;}).join('')}
  <div style="height:10px"></div></div>`;
}
function wordModal(w){
  const i=winfo(w);
  $('#modalBox').innerHTML=`<img class="wimg" src="${wimg(w)}" style="width:120px;height:120px">
  <div class="word-big" style="font-size:26px">${i.w}</div><div class="word-ph">${i.p}</div><div class="word-cn">${i.m}</div>
  <div class="sndrow"><button class="sndbtn" onclick="sndAnim(this)">🔊 播放</button></div>
  <button class="btn btn-gray" style="margin:6px 0 0" onclick="$('#modal').classList.remove('show')">关闭</button>`;
  $('#modal').classList.add('show');
}
// ---------- READ tab ----------
function readRoot(){
  const lv=[1,2,3,4,5,6,7];
  let body='';
  if(S.level===1){
    body=LESSONS.map((l,idx)=>{const st=idx<3?['st-done','✓']:idx===3?['st-cur','▶']:['st-lock','🔒'];return `<div class="lessonrow" onclick="S.lessonIdx=${idx};push('lessonread')">
      <img src="${limg(l.id)}"><div class="lt"><div class="lte">${l.title}</div><div class="ltc">${l.titleCn}</div></div>
      <div class="st ${st[0]}">${st[1]}</div></div>`;}).join('');
  }else{body=`<div class="card pad" style="text-align:center;color:#999;padding:40px 16px">L${S.level} 课文<br>原型演示暂未收录 📚</div>`;}
  return `<div class="view"><div class="bigtitle" style="color:#2B7FFF">读短文</div><div class="subtitle">90 篇分级小故事</div>
  <div class="lvlrow">${lv.map(n=>`<button class="lvlbtn ${S.level===n?'sel':''}" onclick="S.level=${n};render()">L${n}</button>`).join('')}</div>
  ${body}<div style="height:10px"></div></div>`;
}
function lessonRead(){
  const l=LESSONS[S.lessonIdx];
  return `<div class="view">${backBtn()}
  <img class="hero" src="${limg(l.id)}">
  <div class="pad" style="padding-bottom:0"><div style="font-size:20px;font-weight:800">${l.title}</div>
  <div style="color:#999;font-size:14px;margin-top:4px">${l.titleCn}</div>
  <button class="sndbtn" style="margin-top:10px" onclick="sndAnim(this)">🔊 朗读全文</button></div>
  ${l.paras.map(p=>`<div class="para"><div class="en">${p.text}</div><div class="cn">${p.translation}</div></div>`).join('')}
  <div style="height:20px"></div></div>`;
}
// ---------- BOOKS tab ----------
function booksRoot(){
  return `<div class="view"><div class="bigtitle">绘本</div><div class="subtitle">90 本图画故事书</div>
  <div class="bookgrid2">${LESSONS.map((l,idx)=>`<div class="bookcard" onclick="S.lessonIdx=${idx};S.bookPage=0;push('bookread')">
    <img src="${limg(l.id)}"><div class="be">${l.title}</div><div class="bc">${l.titleCn}</div></div>`).join('')}</div>
  <div style="height:10px"></div></div>`;
}
function bookRead(){
  const l=LESSONS[S.lessonIdx],p=l.paras[S.bookPage%l.paras.length];
  return `<div class="view">${backBtn()}
  <div class="card" style="margin-top:8px"><img class="hero" src="${limg(l.id)}" style="aspect-ratio:4/3">
  <div class="pad"><div class="en" style="font-size:17px;line-height:1.8">${p.text}</div>
  <div class="cn" style="color:#999;margin-top:8px">${p.translation}</div>
  <div style="text-align:center;color:#BBB;font-size:12px;margin-top:12px">${(S.bookPage%l.paras.length)+1} / ${l.paras.length}</div></div></div>
  <div class="krow"><button class="kbtn k-nav" onclick="S.bookPage--;render()">‹ 上一页</button>
  <button class="kbtn k-nav" onclick="S.bookPage++;render()">下一页 ›</button></div></div>`;
}
// ---------- PROFILE tab ----------
function profileRoot(){
  return `<div class="view">
  <div class="pheadcard"><div class="avatar">🧒</div><div>
    <div class="pname">小宝贝</div>
    <div class="pstat">📅 已学习 12 天</div>
    <div class="pstat">🔥 连续打卡 5 天</div>
  </div></div>
  <div class="reportcard"><div class="rt">📊 学习报告</div>
  <div class="prow3"><div class="pcard3"><div class="pic">📘</div><div class="v" style="color:#2B7FFF">${S.learned}</div><div class="l">已学单词</div></div>
  <div class="pcard3"><div class="pic">📖</div><div class="v" style="color:#4CAF50">18</div><div class="l">已读短文</div></div>
  <div class="pcard3"><div class="pic">🎯</div><div class="v" style="color:#FF9800">92%</div><div class="l">游戏正确率</div></div></div></div>
  <div class="mrow" onclick="toast('原型演示：儿歌模块')"><div class="mi">🎵</div><div class="mt">英文儿歌</div><div class="arw">›</div></div>
  <div class="mrow" onclick="toast('原型演示：家长验证')"><div class="mi">🔒</div><div class="mt">家长模式</div><div class="lock">🔒</div></div>
  <div class="mrow" onclick="toast('原型演示：每日限时 20 分钟')"><div class="mi">⏰</div><div class="mt">每日限时 20 分钟</div><div class="arw">›</div></div>
  <div class="mrow" onclick="toast('原型演示：设置')"><div class="mi">⚙️</div><div class="mt">设置</div><div class="arw">›</div></div>
  <div style="height:10px"></div></div>`;
}
// ---------- render ----------
const VIEWS={learn_root:learnRoot,wordcard:wordCard,games:gamesGrid,lookword:lookWord,gresult:gResult,
cards_root:cardsRoot,themewords:themeWords,read_root:readRoot,lessonread:lessonRead,
books_root:booksRoot,bookread:bookRead,profile_root:profileRoot};
function render(){const v=cur().view;screen.innerHTML=`<div class="view">${(VIEWS[v]||learnRoot)()}</div>`;screen.scrollTop=0;}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.remove('show');});
renderTabs();render();
</script>
</body>
</html>
