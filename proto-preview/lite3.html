    <button class="btn btn-lblue" onclick="push('games')">巩固练习 · 9 种玩法 🎮</button>
    <div style="height:10px"></div></div>`;
}
function learnPool(){
  if(S.book==='all') return WORDS;
  const t=THEMES.find(t=>t.id===S.book);
  return t? t.words.map(winfo).filter(x=>x.w) : WORDS;
}
function startLearn(){S.learnIdx=0;push('wordcard');}
function wordCard(){
  const pool=learnPool(), i=((S.learnIdx%pool.length)+pool.length)%pool.length, wd=pool[i];
  const total=Math.min(10,pool.length);
  return `<div class="view">${backBtn()}
  <div class="wctitle"><span>背单词 · 第 ${i+1} 个</span><span class="spk" onclick="sndAnim(this)">🔊</span></div>
  <div class="wcprog"><div style="width:${Math.min(100,(i+1)/total*100).toFixed(0)}%"></div></div>
  <div class="wcproglabel">学习进度 ${i+1}/${total}</div>
  <div class="wcard">
    <div><img class="wimg" src="${wimg(wd.w)}" alt=""></div>
    <div class="word-big">${wd.w}</div><div class="word-ph">/${wd.p}/</div><div class="word-cn">${wd.m}</div>
    <div class="sndrow">
      <button class="sndbtn normal" onclick="sndAnim(this)">🔊 正常</button>
      <button class="sndbtn slow" onclick="sndAnim(this)">🐢 慢速</button>
    </div></div>
  <div class="krow"><button class="kbtn k-nav" onclick="S.learnIdx--;render()">← 上一个</button><button class="kbtn k-know" onclick="S.learned++;S.learnIdx++;toast('已学会 +1 🎉');render()">认识 ✓</button><button class="kbtn k-unknow" onclick="S.learnIdx++;render()">不认识 ✕</button><button class="kbtn k-nav" onclick="S.learnIdx++;render()">下一个 →</button></div></div>`;
}
function sndAnim(el){el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');}
function gamesGrid(){
  const gs=[
    ['#5B9BFF',`<svg viewBox="0 0 48 48" width="44" height="44"><circle cx="24" cy="24" r="22" fill="#fff"/><g fill="#3B7BEF"><text x="8" y="20" font-size="12" font-weight="bold" font-family="sans-serif">ABC</text><rect x="8" y="26" width="16" height="12" rx="2" fill="none" stroke="#3B7BEF" stroke-width="2"/><circle cx="13" cy="31" r="2"/><path d="M8 36 L14 30 L18 34 L22 31 L24 36 Z"/></g></svg>`,'看词选图','简单','#3B7BEF','lookword'],
    ['#7ED492',`<svg viewBox="0 0 48 48" width="44" height="44"><circle cx="24" cy="24" r="22" fill="#fff"/><g fill="#4CAF50"><path d="M10 18 L18 18 L26 10 L26 38 L18 30 L10 30 Z"/><rect x="28" y="20" width="12" height="10" rx="2" fill="none" stroke="#4CAF50" stroke-width="2"/></g></svg>`,'听音选图','简单','#4CAF50',''],
    ['#B388FF',`<svg viewBox="0 0 48 48" width="44" height="44"><circle cx="24" cy="24" r="22" fill="#fff"/><g fill="#7C4DFF"><rect x="10" y="12" width="14" height="20" rx="2" fill="none" stroke="#7C4DFF" stroke-width="2.5" transform="rotate(-8 17 22)"/><rect x="24" y="14" width="14" height="20" rx="2" fill="none" stroke="#7C4DFF" stroke-width="2.5" transform="rotate(8 31 24)"/></g></svg>`,'配对消除','中等','#7C4DFF',''],
    ['#FFB74D',`<svg viewBox="0 0 48 48" width="44" height="44"><circle cx="24" cy="24" r="22" fill="#fff"/><g fill="#FF9800"><text x="8" y="20" font-size="12" font-weight="bold" font-family="sans-serif">ABC</text><path d="M10 28 L16 28 L22 22 L22 36 L16 30 L10 30 Z"/></g></svg>`,'看词选音','简单','#FF9800',''],
    ['#F48FB1',`<svg viewBox="0 0 48 48" width="44" height="44"><circle cx="24" cy="24" r="22" fill="#fff"/><g fill="#EC407A"><rect x="8" y="12" width="16" height="12" rx="2" fill="none" stroke="#EC407A" stroke-width="2"/><text x="8" y="36" font-size="12" font-weight="bold" font-family="sans-serif">ABC</text></g></svg>`,'看图选词','中等','#EC407A',''],
    ['#4DD0E1',`<svg viewBox="0 0 48 48" width="44" height="44"><circle cx="24" cy="24" r="22" fill="#fff"/><g fill="#00ACC1"><path d="M12 18 L20 18 L30 8 L30 40 L20 30 L12 30 Z"/><path d="M34 18 C36 21, 36 27, 34 30" fill="none" stroke="#00ACC1" stroke-width="2.5" stroke-linecap="round"/></g></svg>`,'听音选词','中等','#00ACC1',''],
    ['#FFD54F',`<svg viewBox="0 0 48 48" width="44" height="44"><circle cx="24" cy="24" r="22" fill="#fff"/><g fill="#FFC107"><path d="M8 18 L14 18 L20 12 L20 32 L14 26 L8 26 Z"/><circle cx="32" cy="18" r="6"/><path d="M30 24 L30 28 L34 28 L34 24" fill="none" stroke="#FFC107" stroke-width="2"/></g></svg>`,'听音选义','中等','#FFC107',''],
    ['#FF8A80',`<svg viewBox="0 0 48 48" width="44" height="44"><circle cx="24" cy="24" r="22" fill="#fff"/><g fill="#F44336"><text x="6" y="20" font-size="11" font-weight="bold" font-family="sans-serif">ABC</text><circle cx="32" cy="28" r="7"/><path d="M29 34 L29 38 L35 38 L35 34" fill="none" stroke="#F44336" stroke-width="2"/></g></svg>`,'看词选义','简单','#F44336',''],
    ['#3D5AFE',`<svg viewBox="0 0 48 48" width="44" height="44"><circle cx="24" cy="24" r="22" fill="#fff"/><g fill="#2C3EAA"><rect x="10" y="10" width="20" height="28" rx="2" fill="none" stroke="#2C3EAA" stroke-width="2.5"/><path d="M14 18 H26 M14 22 H26 M14 26 H22" stroke="#2C3EAA" stroke-width="2" stroke-linecap="round"/><path d="M28 36 L36 28 L40 32 L32 40 Z"/></g></svg>`,'听写训练','中等','#2C3EAA','']];
  return `<div class="view">${backBtn()}<div class="bigtitle" style="font-size:44px">选个玩法吧！🎮</div><div class="subtitle">9 种游戏，越玩越熟</div>
  <div class="games9">${gs.map(g=>`<div class="gamecard" style="background:${g[0]}" onclick="openGame('${g[5]}','${g[2]}')"><div class="gico">${g[1]}</div><div class="gnm" style="color:${g[4]}">${g[2]}</div><div class="gdiff" style="background:${g[4]}">${g[3]}</div></div>`).join('')}</div></div>`;
}
function openGame(id,name){ if(id==='lookword'){startLookWord();} else toast('原型演示：「'+name+'」暂未开放'); }
function startLookWord(){
  const pool=shuffle(WORDS).slice(0,5);
  S.game.qs=pool.map(w=>({w:w.w,opts:shuffle([w.w,...shuffle(WORDS.filter(x=>x.w!==w.w)).slice(0,3).map(x=>x.w)])}));
  S.game.qi=0;S.game.score=0;S.game.lock=false;push('lookword');
}
function lookWord(){
  const g=S.game,q=g.qs[g.qi];
  return `<div class="view">${backBtn()}
  <h2 class="sec">🔤 看词选图（${g.qi+1}/5）</h2>
  <div class="qword">${q.w}</div><div class="qhint">点击正确的图片</div>
  <div class="opts">${q.opts.map(o=>`<div class="opt" id="opt_${o}" onclick="answer('${o}')"><img src="${wimg(o)}"><div class="ol">${winfo(o).m}</div></div>`).join('')}</div></div>`;
}
function answer(o){
  const g=S.game;if(g.lock)return;const q=g.qs[g.qi],el=document.getElementById('opt_'+o);
  if(o===q.w){g.lock=true;g.score++;el.classList.add('correct');
    setTimeout(()=>{g.qi++;g.lock=false;if(g.qi>=g.qs.length){push('gresult');}else render();},650);
  }else{el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),450);}
}
function gResult(){
  const s=S.game.score,emo=s===5?'🏆':s>=3?'🎉':'💪';
  return `<div class="view" style="text-align:center;padding-top:40px">
  <div style="font-size:20px;font-weight:800">本轮完成！</div><div class="score">${emo}</div>
  <div style="font-size:26px;font-weight:800;color:#FF6B6B">${s} / 5</div>
  <div style="color:#999;margin:8px 0 20px">${s===5?'全部答对，太棒了！':s>=3?'继续加油！':'多练几次会更好～'}</div>
  <button class="btn btn-green" onclick="startLookWord()">🔄 再来一局</button>
  <button class="btn btn-gray" onclick="goBack();goBack()">返回玩法列表</button></div>`;
}
// ---------- CARDS tab ----------
function cardsRoot(){
  const tColors={'fruits':'#FFD6E0','animals':'#FFE0B2','colors':'#BBDEFB','numbers':'#E1BEE7','vehicles':'#BBDEFB','foods':'#FFF9C4','family':'#FFCDD2','body':'#C8E6C9','stationery':'#E1BEE7','toys':'#FFCDD2','nature':'#C8E6C9','home':'#FFE0B2','places':'#D7CCC8','time':'#B2EBF2','actions':'#BBDEFB','adjectives':'#E1BEE7','functions':'#CFD8DC','others':'#F5F5F5'};
  const tProg={'fruits':'#E91E63','animals':'#FF9800','colors':'#2196F3','numbers':'#9C27B0','vehicles':'#2196F3','foods':'#FFC107','family':'#F44336','body':'#4CAF50','stationery':'#9C27B0','toys':'#F44336','nature':'#4CAF50','home':'#FF9800','places':'#795548','time':'#00BCD4','actions':'#2196F3','adjectives':'#9C27B0','functions':'#607D8B','others':'#9E9E9E'};
  return `<div class="view"><div class="bigtitle">单词卡</div><div class="subtitle">按主题找单词</div>
  <div class="themegrid2">${THEMES.map(t=>{const bg=tColors[t.id]||'#F5F5F5',pc=tProg[t.id]||'#9E9E9E';return `<div class="themecard" style="background:${bg}" onclick="openTheme('${t.id}')">
    <div style="display:flex;flex-direction:column;align-items:flex-start"><img src="${wimg(t.icon)}"><div class="tnm">${t.nameCn}</div></div><div class="tprog" style="color:${pc}">${t.count}/${t.count} ✓</div></div>`;}).join('')}</div>
  <div style="height:10px"></div></div>`;
}
function openTheme(id){const t=THEMES.find(t=>t.id===id);S.themeWords=t.words;S.themeName=t.nameCn;push('themewords');}
function themeWords(){
  return `<div class="view">${backBtn()}<h2 class="sec">${S.themeName}（${S.themeWords.length}词）</h2>
  ${S.themeWords.map(w=>{const i=winfo(w);return `<div class="lrow wordrow" onclick="wordModal('${w}')">
    <img src="${wimg(w)}"><div><div class="tt">${i.w}</div><div class="tc">${i.m}</div></div>
    <div class="st st-todo">👁</div></div>`;}).join('')}
  <div style="height:10px"></div></div>`;
}
function wordModal(w){
  const i=winfo(w);
  $('#modalBox').innerHTML=`<img class="wimg" src="${wimg(w)}" style="width:120px;height:120px">
  <div class="word-big" style="font-size:26px">${i.w}</div><div class="word-ph">${i.p}</div><div class="word-cn">${i.m}</div>
  <div class="sndrow"><button class="sndbtn" onclick="sndAnim(this)">🔊 播放</button></div>
  <button class="btn btn-gray" style="margin:6px 0 0" onclick="$('#modal').classList.remove('show')">关闭</button>`;
  $('#modal').classList.add('show');
}
// ---------- READ tab ----------
function readRoot(){
  const lv=[1,2,3,4,5,6,7];
  let body='';
  if(S.level===1){
    body=LESSONS.map((l,idx)=>{const st=idx<3?['st-done','✓']:idx===3?['st-cur','▶']:['st-lock','🔒'];return `<div class="lessonrow" onclick="S.lessonIdx=${idx};push('lessonread')">
      <img src="${limg(l.id)}"><div class="lt"><div class="lte">${l.title}</div><div class="ltc">${l.titleCn}</div></div>
      <div class="st ${st[0]}">${st[1]}</div></div>`;}).join('');
  }else{body=`<div class="card pad" style="text-align:center;color:#999;padding:40px 16px">L${S.level} 课文<br>原型演示暂未收录 📚</div>`;}
  return `<div class="view"><div class="bigtitle" style="color:#2B7FFF">读短文</div><div class="subtitle">90 篇分级小故事</div>
  <div class="lvlrow">${lv.map(n=>`<button class="lvlbtn ${S.level===n?'sel':''}" onclick="S.level=${n};render()">L${n}</button>`).join('')}</div>
  ${body}<div style="height:10px"></div></div>`;
}
function lessonRead(){
  const l=LESSONS[S.lessonIdx];
  return `<div class="view">${backBtn()}
  <img class="hero" src="${limg(l.id)}">
  <div class="pad" style="padding-bottom:0"><div style="font-size:20px;font-weight:800">${l.title}</div>
  <div style="color:#999;font-size:14px;margin-top:4px">${l.titleCn}</div>
  <button class="sndbtn" style="margin-top:10px" onclick="sndAnim(this)">🔊 朗读全文</button></div>
  ${l.paras.map(p=>`<div class="para"><div class="en">${p.text}</div><div class="cn">${p.translation}</div></div>`).join('')}
  <div style="height:20px"></div></div>`;
}
// ---------- BOOKS tab ----------
function booksRoot(){
  return `<div class="view"><div class="bigtitle">绘本</div><div class="subtitle">90 本图画故事书</div>
  <div class="bookgrid2">${LESSONS.map((l,idx)=>`<div class="bookcard" onclick="S.lessonIdx=${idx};S.bookPage=0;push('bookread')">
    <img src="${limg(l.id)}"><div class="be">${l.title}</div><div class="bc">${l.titleCn}</div></div>`).join('')}</div>
  <div style="height:10px"></div></div>`;
}
function bookRead(){
  const l=LESSONS[S.lessonIdx],p=l.paras[S.bookPage%l.paras.length];
  return `<div class="view">${backBtn()}
  <div class="card" style="margin-top:8px"><img class="hero" src="${limg(l.id)}" style="aspect-ratio:4/3">
  <div class="pad"><div class="en" style="font-size:17px;line-height:1.8">${p.text}</div>
  <div class="cn" style="color:#999;margin-top:8px">${p.translation}</div>
  <div style="text-align:center;color:#BBB;font-size:12px;margin-top:12px">${(S.bookPage%l.paras.length)+1} / ${l.paras.length}</div></div></div>
  <div class="krow"><button class="kbtn k-nav" onclick="S.bookPage--;render()">‹ 上一页</button>
  <button class="kbtn k-nav" onclick="S.bookPage++;render()">下一页 ›</button></div></div>`;
}
// ---------- PROFILE tab ----------
function profileRoot(){
  return `<div class="view">
  <div class="pheadcard"><div class="avatar">🧒</div><div>
    <div class="pname">小宝贝</div>
    <div class="pstat">📅 已学习 12 天</div>
    <div class="pstat">🔥 连续打卡 5 天</div>
  </div></div>
  <div class="reportcard"><div class="rt">📊 学习报告</div>
  <div class="prow3"><div class="pcard3"><div class="pic">📘</div><div class="v" style="color:#2B7FFF">${S.learned}</div><div class="l">已学单词</div></div>
  <div class="pcard3"><div class="pic">📖</div><div class="v" style="color:#4CAF50">18</div><div class="l">已读短文</div></div>
  <div class="pcard3"><div class="pic">🎯</div><div class="v" style="color:#FF9800">92%</div><div class="l">游戏正确率</div></div></div></div>
  <div class="mrow" onclick="toast('原型演示：儿歌模块')"><div class="mi">🎵</div><div class="mt">英文儿歌</div><div class="arw">›</div></div>
  <div class="mrow" onclick="toast('原型演示：家长验证')"><div class="mi">🔒</div><div class="mt">家长模式</div><div class="lock">🔒</div></div>
  <div class="mrow" onclick="toast('原型演示：每日限时 20 分钟')"><div class="mi">⏰</div><div class="mt">每日限时 20 分钟</div><div class="arw">›</div></div>
  <div class="mrow" onclick="toast('原型演示：设置')"><div class="mi">⚙️</div><div class="mt">设置</div><div class="arw">›</div></div>
  <div style="height:10px"></div></div>`;
}
// ---------- render ----------
const VIEWS={learn_root:learnRoot,wordcard:wordCard,games:gamesGrid,lookword:lookWord,gresult:gResult,
cards_root:cardsRoot,themewords:themeWords,read_root:readRoot,lessonread:lessonRead,
books_root:booksRoot,bookread:bookRead,profile_root:profileRoot};
function render(){const v=cur().view;screen.innerHTML=`<div class="view">${(VIEWS[v]||learnRoot)()}</div>`;screen.scrollTop=0;}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.remove('show');});
renderTabs();render();
</script>
</body>
