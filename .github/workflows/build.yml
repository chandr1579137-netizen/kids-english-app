name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 仓库里有两份 .swift（KidsEnglish/ 与 KidsEnglish/KidsEnglish/），
      # Xcode 实际编译的是后者。历史上因此出现过「改了外层、CI 编译内层」的静默漂移，
      # 导致截图与源码对不上。这里直接失败，不让旧代码混过去。
      - name: Verify duplicated sources are in sync
        run: |
          fail=0
          for f in KidsEnglish/*.swift; do
            b="KidsEnglish/KidsEnglish/$(basename "$f")"
            if [ -f "$b" ] && ! diff -q "$f" "$b" >/dev/null; then
              echo "::error file=$f::与 $b 不一致（Xcode 编译的是后者）"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "源码双目录已漂移，请先同步再构建"
            exit 1
          fi
          echo "源码一致 ✓"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Download assets bundle v3 (word icons, lesson illustrations)
        run: |
          curl -sfL -o assets-bundle-v3.zip \
            "https://github.com/chandr1579137-netizen/kids-english-app/releases/download/assets-v3/assets-bundle-v3.zip"
          unzip -q -o assets-bundle-v3.zip
          echo "word-icons     $(ls KidsEnglish/KidsEnglish/Resources/word-icons | wc -l)"
          echo "illustrations  $(ls KidsEnglish/KidsEnglish/Resources/lesson-illustrations | wc -l)"
          echo "covers         $(ls KidsEnglish/KidsEnglish/Resources/covers | wc -l)"

      - name: Download lesson audio (from upstream open-source repo)
        run: |
          cd KidsEnglish/KidsEnglish/Resources/audio
          python3 << 'PYEOF'
          import json, urllib.request, os
          files = json.load(open('../../../audio-files.json'))
          base = 'https://raw.githubusercontent.com/xckevin/magic-english-buddy/main/public/audio/'
          ok = 0
          for f in files:
              if not os.path.exists(f):
                  urllib.request.urlretrieve(base + f, f)
              ok += 1
          print(f'audio ready: {ok}/{len(files)}')
          PYEOF
          ls *.mp3 | wc -l

      - name: Build (unsigned)
        run: |
          xcodebuild -project KidsEnglish/KidsEnglish.xcodeproj \
            -scheme KidsEnglish \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/KidsEnglish.app" Payload/
          zip -r KidsEnglish-unsigned.ipa Payload
          ls -lh KidsEnglish-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KidsEnglish-unsigned-ipa
          path: KidsEnglish-unsigned.ipa

      # ---- 以下是视觉评审用的模拟器截图：真实 SwiftUI 渲染，不是 HTML 仿制 ----

      - name: Build for simulator
        run: |
          xcodebuild -project KidsEnglish/KidsEnglish.xcodeproj \
            -scheme KidsEnglish \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator and capture screenshots
        run: |
          set -e
          echo "--- 可用设备 ---"
          xcrun simctl list devices available | grep -i iphone | head -5
          DEVICE=$(xcrun simctl list devices available \
            | grep -i iphone | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "device=$DEVICE"
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 2>/dev/null || true

          APP=$(find build-sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          test -n "$APP"
          xcrun simctl install "$DEVICE" "$APP"

          mkdir -p shots
          shoot() {
            name="$1"; shift
            xcrun simctl terminate "$DEVICE" com.kidsenglish.app 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$DEVICE" com.kidsenglish.app "$@" || echo "launch failed: $name"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "shots/$name.png"
          }

          shoot 01-learn    -uiTab 0
          shoot 02-cards    -uiTab 1
          shoot 03-read     -uiTab 2
          shoot 04-picture  -uiTab 3
          shoot 05-profile  -uiTab 4
          shoot 06-study    -uiTab 0 -uiStudy
          ls -lh shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KidsEnglish-screenshots
          path: shots/
