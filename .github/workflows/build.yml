name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Download assets bundle v3 (word icons, lesson illustrations)
        run: |
          curl -sfL -o assets-bundle-v3.zip \
            "https://muse.ai/files/1412548825264485/28149411608070162/97jiuiu7vahas4vrykc1nghi/assets-bundle-v3.zip"
          unzip -q -o assets-bundle-v3.zip
          mkdir -p KidsEnglish/Resources/audio \
                   KidsEnglish/Resources/audio-slow \
                   KidsEnglish/Resources/covers \
                   KidsEnglish/Resources/word-icons \
                   KidsEnglish/Resources/lesson-illustrations \
                   KidsEnglish/Resources/ui-icons
          if [ -d KidsEnglish/KidsEnglish/Resources ]; then
            cp -R KidsEnglish/KidsEnglish/Resources/. KidsEnglish/Resources/
          fi
          if [ -d KidsEnglish/Resources/lesson-illustrations ]; then
            find KidsEnglish/Resources/lesson-illustrations -type f | wc -l
          fi

      - name: Download lesson audio (from upstream open-source repo)
        run: |
          mkdir -p KidsEnglish/Resources/audio
          cd KidsEnglish/Resources/audio
          python3 << 'PYEOF'
          import json, urllib.request, os
          files = json.load(open('../../audio-files.json'))
          base = 'https://raw.githubusercontent.com/xckevin/magic-english-buddy/main/public/audio/'
          ok = 0
          for f in files:
              if not os.path.exists(f):
                  urllib.request.urlretrieve(base + f, f)
              ok += 1
          print(f'audio ready: {ok}/{len(files)}')
          PYEOF
          ls *.mp3 | wc -l

      - name: Build (unsigned)
        run: |
          xcodebuild -project KidsEnglish.xcodeproj \
            -scheme KidsEnglish \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/KidsEnglish.app" Payload/
          zip -r KidsEnglish-unsigned.ipa Payload
          ls -lh KidsEnglish-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KidsEnglish-unsigned-ipa
          path: KidsEnglish-unsigned.ipa
