name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 仓库里有两份 .swift（KidsEnglish/ 与 KidsEnglish/KidsEnglish/），
      # Xcode 实际编译的是后者。历史上因此出现过「改了外层、CI 编译内层」的静默漂移，
      # 导致截图与源码对不上。这里直接失败，不让旧代码混过去。
      - name: Verify duplicated sources are in sync
        run: |
          fail=0
          for f in KidsEnglish/*.swift; do
            b="KidsEnglish/KidsEnglish/$(basename "$f")"
            if [ -f "$b" ] && ! diff -q "$f" "$b" >/dev/null; then
              echo "::error file=$f::与 $b 不一致（Xcode 编译的是后者）"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "源码双目录已漂移，请先同步再构建"
            exit 1
          fi
          echo "源码一致 ✓"

      - name: Show Xcode version
        run: xcodebuild -version

      # DataStore 用 try? 解码 JSON，字段缺失只会静默变空数组（课文/单词凭空少一批），
      # 界面照常渲染。这里按 Swift 模型的必填字段做结构校验，把静默变成构建失败。
      - name: Validate resource JSON
        run: python3 scripts/validate_resources.py KidsEnglish/KidsEnglish/Resources

      # 模型层单测：SwiftPM 只编 Models.swift（纯 Foundation），不用模拟器也不用 test target。
      # 拦的是「JSON 改了但 Swift 解不出来」——DataStore 用 try? 解码，这类问题会静默丢数据。
      - name: Run model unit tests
        run: swift test --package-path .

      # 仓库里 Resources 存了两份（外层与 KidsEnglish/KidsEnglish/ 下），Xcode 用内层。
      # 历史上两份漂移过；JSON 不像 .swift 有现成的 diff 守卫，这里补上。
      - name: Verify duplicated resources are in sync
        run: |
          fail=0
          for f in KidsEnglish/Resources/*.json; do
            b="KidsEnglish/KidsEnglish/Resources/$(basename "$f")"
            if [ -f "$b" ] && ! diff -q "$f" "$b" >/dev/null; then
              echo "::error file=$f::与 $b 不一致"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "资源双份已漂移，请先同步"
            exit 1
          fi
          echo "资源副本一致 ✓"

      - name: Download assets bundle v3 (word icons, lesson illustrations)
        run: |
          curl -sfL -o assets-bundle-v3.zip \
            "https://github.com/chandr1579137-netizen/kids-english-app/releases/download/assets-v3/assets-bundle-v3.zip"
          unzip -q -o assets-bundle-v3.zip
          echo "word-icons     $(ls KidsEnglish/KidsEnglish/Resources/word-icons | wc -l)"
          echo "illustrations  $(ls KidsEnglish/KidsEnglish/Resources/lesson-illustrations | wc -l)"
          echo "covers         $(ls KidsEnglish/KidsEnglish/Resources/covers | wc -l)"

      # 资源包的 3D 图标是不透明白底，压在彩色卡片上会变成「白方贴纸」。
      # 从边缘泛洪抠掉外圈背景，内部白色（熊猫脸等）保留。
      - name: Make ui-icons transparent
        run: |
          # macOS runner 的 python3 是 externally-managed，直接 pip 会被 PEP 668 拒绝
          python3 -m venv .venv-icons
          .venv-icons/bin/pip install --quiet pillow
          .venv-icons/bin/python scripts/make_icons_transparent.py KidsEnglish/KidsEnglish/Resources/ui-icons

      # 图标曾经被误存成 Base64 文本（文件名是 .png，内容是 iVBORw0K...），
      # UIImage 加载失败后全部静默回退成问号，而上面的透明化脚本逐文件吞异常，
      # CI 一直绿的。这里加硬断言：文件名、PNG 签名、可解码、正方形，一个不合格就失败。
      - name: Verify ui-icons are real PNGs
        run: |
          .venv-icons/bin/python - <<'PYEOF'
          import pathlib, sys
          from PIL import Image
          root = pathlib.Path("KidsEnglish/KidsEnglish/Resources/ui-icons")
          files = sorted(root.glob("*.png"))
          bad = []
          for f in files:
              head = f.read_bytes()[:8]
              if head != b"\x89PNG\r\n\x1a\n":
                  bad.append(f"{f.name}: 不是 PNG 签名（可能是 Base64 文本）")
                  continue
              with Image.open(f) as im:
                  if im.size != (256, 256):
                      bad.append(f"{f.name}: 尺寸 {im.size}，应为 256x256")
                  if im.mode != "RGBA":
                      bad.append(f"{f.name}: 模式 {im.mode}，应为 RGBA")
          print(f"ui-icons: {len(files)} 个文件检查完毕")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          PYEOF

      - name: Download lesson audio (from upstream open-source repo)
        run: |
          cd KidsEnglish/KidsEnglish/Resources/audio
          python3 << 'PYEOF'
          import json, urllib.request, os
          files = json.load(open('../../../audio-files.json'))
          base = 'https://raw.githubusercontent.com/xckevin/magic-english-buddy/main/public/audio/'
          ok = 0
          for f in files:
              if not os.path.exists(f):
                  urllib.request.urlretrieve(base + f, f)
              ok += 1
          print(f'audio ready: {ok}/{len(files)}')
          PYEOF
          ls *.mp3 | wc -l

      - name: Build (unsigned)
        run: |
          xcodebuild -project KidsEnglish/KidsEnglish.xcodeproj \
            -scheme KidsEnglish \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/KidsEnglish.app" Payload/
          zip -r KidsEnglish-unsigned.ipa Payload
          ls -lh KidsEnglish-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KidsEnglish-unsigned-ipa
          path: KidsEnglish-unsigned.ipa

      # ---- 以下是视觉评审用的模拟器截图：真实 SwiftUI 渲染，不是 HTML 仿制 ----

      - name: Build for simulator
        run: |
          xcodebuild -project KidsEnglish/KidsEnglish.xcodeproj \
            -scheme KidsEnglish \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator and capture screenshots
        run: |
          set -e
          echo "--- 可用设备 ---"
          xcrun simctl list devices available | grep -i iphone | head -5
          DEVICE=$(xcrun simctl list devices available \
            | grep -i iphone | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "device=$DEVICE"
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b

          # 模拟器默认英文，系统返回键会显示 "Back" —— 这个 App 全中文，
          # 截图必须反映真实用户看到的样子，所以先把设备语言设成简体中文
          xcrun simctl spawn "$DEVICE" defaults write .GlobalPreferences AppleLanguages -array zh-Hans
          xcrun simctl spawn "$DEVICE" defaults write .GlobalPreferences AppleLocale -string zh_CN
          xcrun simctl shutdown "$DEVICE" 2>/dev/null || true
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b

          xcrun simctl status_bar "$DEVICE" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 2>/dev/null || true

          APP=$(find build-sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          test -n "$APP"
          xcrun simctl install "$DEVICE" "$APP"

          mkdir -p shots
          shoot() {
            name="$1"; shift
            xcrun simctl terminate "$DEVICE" com.kidsenglish.app 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$DEVICE" com.kidsenglish.app "$@" || echo "launch failed: $name"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "shots/$name.png"
          }

          shoot 01-learn    -uiTab 0
          shoot 02-cards    -uiTab 1
          shoot 03-read     -uiTab 2
          shoot 05-profile  -uiTab 3
          shoot 06-study    -uiTab 0 -uiStudy
          # 新增：这两页原本不在覆盖内，里面的旧系统色因此长期没被发现
          shoot 07-games    -uiTab 0 -uiConsolidate
          shoot 08-lesson   -uiTab 2 -uiLesson

          # 9 个玩法内页：此前全部是盲区（只有网格页被拍过）。
          # 顺序同 ConsolidationView.Mode 的声明顺序。
          shoot 09-game-word2image    -uiTab 0 -uiConsolidate -uiGame 0
          shoot 10-game-audio2image   -uiTab 0 -uiConsolidate -uiGame 1
          shoot 11-game-matching      -uiTab 0 -uiConsolidate -uiGame 2
          shoot 12-game-word2audio    -uiTab 0 -uiConsolidate -uiGame 3
          shoot 13-game-image2word    -uiTab 0 -uiConsolidate -uiGame 4
          shoot 14-game-audio2word    -uiTab 0 -uiConsolidate -uiGame 5
          shoot 15-game-audio2meaning -uiTab 0 -uiConsolidate -uiGame 6
          shoot 16-game-word2meaning  -uiTab 0 -uiConsolidate -uiGame 7
          shoot 17-game-dictation     -uiTab 0 -uiConsolidate -uiGame 8

          # 二级页：主题词表 / 收藏 / 儿歌 / 家长验证 / 设置
          shoot 18-theme-words  -uiTab 1 -uiTheme fruits
          shoot 19-favorites    -uiTab 3 -uiProfile favorites
          shoot 20-songs        -uiTab 3 -uiProfile songs
          shoot 21-parent-gate  -uiTab 3 -uiProfile parent
          shoot 22-settings     -uiTab 3 -uiProfile settings
          shoot 23-parent-dash -uiTab 3 -uiProfile parent-dash

          # 大字号：验证 Dynamic Type 下没有文字被裁/错位（-uiLargeText → accessibility2）
          shoot 24-large-learn   -uiTab 0 -uiLargeText
          shoot 25-large-cards   -uiTab 1 -uiLargeText
          shoot 26-large-lesson  -uiTab 2 -uiLesson -uiLargeText

          # 大字号 × 元素最密的页面：游戏内页、学习判定、主题词表、设置
          shoot 27-large-study        -uiTab 0 -uiStudy -uiLargeText
          shoot 28-large-game-word2image    -uiTab 0 -uiConsolidate -uiGame 0 -uiLargeText
          shoot 29-large-game-audio2image   -uiTab 0 -uiConsolidate -uiGame 1 -uiLargeText
          shoot 30-large-game-matching      -uiTab 0 -uiConsolidate -uiGame 2 -uiLargeText
          shoot 31-large-game-word2audio    -uiTab 0 -uiConsolidate -uiGame 3 -uiLargeText
          shoot 32-large-game-image2word    -uiTab 0 -uiConsolidate -uiGame 4 -uiLargeText
          shoot 33-large-game-audio2word    -uiTab 0 -uiConsolidate -uiGame 5 -uiLargeText
          shoot 34-large-game-audio2meaning -uiTab 0 -uiConsolidate -uiGame 6 -uiLargeText
          shoot 35-large-game-word2meaning  -uiTab 0 -uiConsolidate -uiGame 7 -uiLargeText
          shoot 36-large-game-dictation     -uiTab 0 -uiConsolidate -uiGame 8 -uiLargeText
          shoot 37-large-theme-words   -uiTab 1 -uiTheme fruits -uiLargeText
          shoot 38-large-settings      -uiTab 3 -uiProfile settings -uiLargeText
          shoot 39-large-favorites     -uiTab 3 -uiProfile favorites -uiLargeText
          # 孩子看得到的提示卡片（系统 Alert 已替换成 App 内样式）
          shoot 40-large-alert-unknown -uiTab 2 -uiLesson -uiAlert unknown -uiLargeText
          shoot 41-large-alert-mic     -uiTab 2 -uiLesson -uiAlert mic -uiLargeText
          shoot 42-large-alert-clear   -uiTab 3 -uiProfile parent-dash -uiAlert clear -uiLargeText
          ls -lh shots

      - name: Capture iPad screenshots
        # 同一构建产物装到 iPad 模拟器，验证 iPad 原生布局。
        # 注意：这里不设设备语言（那需要 shutdown→boot 再来一轮，既慢又容易挂），
        # 系统 chrome 可能是英文，但 App 自身文案全是中文。
        timeout-minutes: 12
        run: |
          set -e
          DEVICE=$(xcrun simctl list devices available | grep -i ipad | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "device=$DEVICE"
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          # simctl bootstatus 没有超时，模拟器起不来会一直等；改成有界轮询（最多 3 分钟）
          for i in $(seq 1 90); do
            if xcrun simctl list devices | grep "$DEVICE" | grep -q Booted; then
              echo "booted after $((i * 2))s"
              break
            fi
            sleep 2
          done
          xcrun simctl list devices | grep "$DEVICE"
          xcrun simctl status_bar "$DEVICE" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 2>/dev/null || true

          APP=$(find build-sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          xcrun simctl install "$DEVICE" "$APP"

          # 首次冷启动要好几秒才渲染完，直接截图会拍到白屏窗口，先预热一次
          xcrun simctl launch "$DEVICE" com.kidsenglish.app -uiTab 0 >/dev/null 2>&1 || true
          sleep 8
          xcrun simctl terminate "$DEVICE" com.kidsenglish.app 2>/dev/null || true

          mkdir -p shoot-ipad
          shoot() {
            name="$1"; shift
            xcrun simctl terminate "$DEVICE" com.kidsenglish.app 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$DEVICE" com.kidsenglish.app "$@" || echo "launch failed: $name"
            sleep 4
            xcrun simctl io "$DEVICE" screenshot "shoot-ipad/$name.png"
          }
          shoot ipad-01-learn   -uiTab 0
          shoot ipad-02-cards   -uiTab 1
          shoot ipad-08-lesson  -uiTab 2 -uiLesson
          # iPad × 大字号交叉：内容列 720pt + 1.35 倍字号
          shoot ipad-large-01-learn  -uiTab 0 -uiLargeText
          shoot ipad-large-02-cards  -uiTab 1 -uiLargeText
          shoot ipad-large-08-lesson -uiTab 2 -uiLesson -uiLargeText
          ls -lh shoot-ipad

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KidsEnglish-screenshots
          path: |
            shots/
            shoot-ipad/
          if-no-files-found: warn
