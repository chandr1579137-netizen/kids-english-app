name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # OpenCode Console service account key.
          # Create one at https://opencode.ai/console -> API -> Service accounts.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # DeepSeek served by OpenCode.
          #   pay-as-you-go (Console credits): opencode/deepseek-v4.1-flash
          #   Go subscription ($10/mo):        opencode-go/deepseek-v4.1-flash
          # stronger but pricier:              .../deepseek-v4-pro
          model: opencode/deepseek-v4.1-flash
          # Use the built-in GITHUB_TOKEN instead of the OpenCode GitHub App.
          use_github_token: true
