name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Download assets bundle (covers, songs, icon)
        run: |
          curl -sfL -o assets-bundle.zip \
            "https://muse.ai/files/1412548825264485/2432515100888869/zdaavcqas9dozl8mvg3czxk2/assets-bundle.zip"
          unzip -q -o assets-bundle.zip
          ls KidsEnglish/KidsEnglish/Resources/covers | wc -l

      - name: Download lesson audio (from upstream open-source repo)
        run: |
          cd KidsEnglish/KidsEnglish/Resources/audio
          python3 << 'EOF'
          import json, urllib.request, os
          files = json.load(open('../../audio-files.json'))
          base = 'https://raw.githubusercontent.com/xckevin/magic-english-buddy/main/public/audio/'
          ok = 0
          for f in files:
              if not os.path.exists(f):
                  urllib.request.urlretrieve(base + f, f)
              ok += 1
          print(f'audio ready: {ok}/{len(files)}')
          EOF
          ls *.mp3 | wc -l

      - name: Build (unsigned)
        run: |
          xcodebuild -project KidsEnglish/KidsEnglish.xcodeproj \
            -target KidsEnglish \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/KidsEnglish.app" Payload/
          zip -r KidsEnglish-unsigned.ipa Payload
          ls -lh KidsEnglish-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KidsEnglish-unsigned-ipa
          path: KidsEnglish-unsigned.ipa
